name: StarterPlayerScripts
type: class
category: Scripting
memory_category: Instances
summary: |
  A container for objects to be copied to a Player's PlayerScripts when they
  join a game.
description: |
  `Class.StarterPlayerScripts` is a container object located within the
  `Class.StarterPlayer` service. It can contain `Class.LocalScript|LocalScripts`
  and other objects to be copied to the `Class.PlayerScripts` container once
  when a `Class.Player` joins the game. For example, if you want to create
  special effects on the client when certain conditions are met, you can place a
  `Class.LocalScript` within this container to do that.

  This object is also a good place for `Class.LocalScript|LocalScripts` that
  define additional inputs with `Class.ContextActionService`. For inputs that
  are only relevant when a player has spawned in, you can use
  `Class.ContextActionService:BindAction()` when the `Class.Players.LocalPlayer`
  character spawns, then use `Class.ContextActionService:UnbindAction()` when
  they die or despawn.

  #### Modifying control scripts

  When an experience is run, this object will also house the default
  multi-platform Roblox control scripts for the camera and character. If
  `Class.LocalScript|LocalScripts` named `CameraScript` or `ControlScript` are
  placed within this container, they will **replace** the Roblox defaults for
  those scripts respectively. If desired, you can add empty
  `Class.LocalScript|LocalScripts` for each of these to disable them altogether;
  this is useful for experiences that do not follow the typical control
  paradigms of a Roblox experience.
code_samples:
inherits:
  - Instance
tags:
  - NotCreatable
deprecation_message: ''
properties: []
methods: []
events: []
callbacks: []
local Players = game:GetService("Players")
local RunService = game:GetService("RunService")
local UserInputService = game:GetService("UserInputService")

local player = Players.LocalPlayer
local camera = workspace.CurrentCamera

local lockOnRange = 50 -- studs
local isLocked = false
local target = nil

-- Function to get closest enemy
local function getClosestEnemy()
	local closest = nil
	local shortestDistance = lockOnRange

	for _, enemy in pairs(workspace.Enemies:GetChildren()) do
		if enemy:FindFirstChild("HumanoidRootPart") then
			local distance = (enemy.HumanoidRootPart.Position - player.Character.HumanoidRootPart.Position).Magnitude
			if distance < shortestDistance then
				shortestDistance = distance
				closest = enemy
			end
		end
	end

	return closest
end

-- Toggle Lock-On with "Q"
UserInputService.InputBegan:Connect(function(input, gameProcessed)
	if gameProcessed then return end

	if input.KeyCode == Enum.KeyCode.Q then
		if not isLocked then
			target = getClosestEnemy()
			if target then
				isLocked = true
			end
		else
			isLocked = false
			target = nil
		end
	end
end)

-- Update camera every frame
RunService.RenderStepped:Connect(function()
	if isLocked and target and target:FindFirstChild("HumanoidRootPart") then
		camera.CFrame = CFrame.new(camera.CFrame.Position, target.HumanoidRootPart.Position)
	end
end)


